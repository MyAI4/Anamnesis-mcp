[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anamnesis-mcp"
version = "0.1.0"
description = "MCP server that gives AI coding agents persistent, traceable memory across projects and sessions"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.11"
authors = [
    { name = "Arek Kulpa" },
]
keywords = ["mcp", "memory", "ai", "agents", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
anamnesis-mcp = "anamnesis_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anamnesis_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
